name: Build and offline tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential git pkg-config libusb-1.0-0-dev python3
      - name: Check shell syntax and build
        run: bash -n build.sh ndless.sh && ./build.sh
      - name: Run hardware-free checks
        run: python3 -m unittest discover -s tests -v
